name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attest"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build, attest, and upload release assets
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate release tag
        run: |
          set -euo pipefail
          version="$(node -p "require('./manifest.json').version")"
          if [ "$version" != "$RELEASE_TAG" ]; then
            echo "manifest.json version $version does not match release tag $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Run lint
        run: pnpm lint

      - name: Build release assets
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/obsidian-test-vault/.obsidian"
          OBSIDIAN_TEST_VAULT="$RUNNER_TEMP/obsidian-test-vault" pnpm build

      - name: Verify release assets
        run: |
          set -euo pipefail
          test -s main.js
          test -s manifest.json
          test -s styles.css

      - name: Attest release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" main.js manifest.json styles.css --clobber
          else
            gh release create "$RELEASE_TAG" main.js manifest.json styles.css --title "$RELEASE_TAG" --generate-notes
          fi
